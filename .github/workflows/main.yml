name: Build & Deploy

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, zip

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Build the site
        run: php hyde build --no-interaction

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "gh-pages"

      - name: Empty site directory
        run: rm -rf *

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: "."

      - name: Create .nojekyll file
        run: touch .nojekyll

      - name: Create CNAME file
        run: echo "www.ebrubasakftr.com" > CNAME

      - name: Create robots.txt
        run: |
          echo "User-agent: *" > robots.txt
          echo "Allow: /" >> robots.txt
          echo "Sitemap: https://www.ebrubasakftr.com/sitemap.xml" >> robots.txt

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: "."
          message: "Upload compiled site ${{ github.sha }}"
